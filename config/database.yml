# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: rails_dream_of_code_app_final_project_development

test:
  <<: *default
  database: rails_dream_of_code_app_final_project_test

production:
  primary: &primary_production
    <<: *default
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    database: rails_dream_of_code_app_final_project_production
    username: <%= ENV.fetch("DATABASE_USER", "rails_dream_of_code_app_final_project") %>
    password: <%= ENV["RAILS_DREAM_OF_CODE_APP_FINAL_PROJECT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rails_dream_of_code_app_final_project_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_dream_of_code_app_final_project_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rails_dream_of_code_app_final_project_production_cable
    migrations_paths: db/cable_migrate
