# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: rails_dream_of_code_app_final_project_development

test:
  <<: *default
  database: rails_dream_of_code_app_final_project_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
