# docker-compose.yml
services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: rails_dream_of_code_app_final_project
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rails_dream_of_code_app_final_project_production
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rails_dream_of_code_app_final_project"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: bash -c "bin/rails db:create db:migrate && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_DREAM_OF_CODE_APP_FINAL_PROJECT_DATABASE_PASSWORD: password
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: rails_dream_of_code_app_final_project
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"

volumes:
  postgres_data:
